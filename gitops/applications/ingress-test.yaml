apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-test
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Ntokozo974/cloud-hpl-scc26.git
    targetRevision: feature/week2-kubernetes
    path: gitops/resources/ingress-test
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
